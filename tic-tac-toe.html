<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Ultimate Tic Tac Toe</title>
</head>

    <section id="menu">

        <div class="rows" id="row2">

            <div class="game_box" id="4"></div>
            <div class="game_box" id="5"></div>
        </div>
        <div class="rows" id="row3">
            <div class="game_box" id="6"></div>
            <div class="game_box" id="7"></div>
            <div class="game_box" id="8"></div>
        </div>
    </section>
